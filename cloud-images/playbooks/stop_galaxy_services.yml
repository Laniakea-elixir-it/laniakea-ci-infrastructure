---
- hosts: default
  become: true
  become_user: root
  vars:
    debug: false
    # SSH laniakea robot key
    laniakea_robot_key_pub: 'ssh-rsa '
  pre_tasks:
    - name: 'Inject laniakea-robot ssh public key for debug - root'
      authorized_key:
        user: 'root'
        key: '{{ laniakea_robot_key_pub }}'
      ignore_errors: true
      when: debug

  tasks:
    # Stop services
    - name: stop galaxy
      command: "/usr/local/bin/galaxyctl -c /home/galaxy/galaxy/config/galaxy.yml stop"
      become: yes
    - name: stop TUSd
      systemd:
        state: stopped
        enabled: false
        name: galaxy-tusd
    - name: stop nginx
      systemd:
        state: stopped
        enabled: false
        name: nginx
    - name: stop postgresql
      systemd:
        state: stopped
        enabled: false
        name: 'postgresql-{{ postgresql_version }}'
    - name: stop docker.service
      systemd:
        state: stopped
        enabled: false
        name: docker.service
      when: enable_interactive_tools
    - name: stop docker.socket
      systemd:
        state: stopped
        enabled: false
        name: docker.socket
      when: enable_interactive_tools

    # Clean the environment
    # Otherwise conda will start to install in temp directory
    - name: 'Clean /export content'
      file:
        state: absent
        path: '{{ export_dir }}'
